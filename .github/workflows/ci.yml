name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run graph:build
      - name: Verify generated graph is committed
        run: git diff --exit-code -- data/knowledge-graph.json public/data/knowledge-graph.json
      - run: npm run build
